# ---------------------------------------------------------------------------
# Les controles du projet, a chaque poussee et a chaque pull request.
#
# Ils existaient deja, mais ne tournaient que sur la machine de l auteur, dans
# le hook pre-commit. Une modification faite depuis l interface web de GitHub,
# depuis un autre poste, ou par un workflow n etait verifiee par personne.
#
# Tout tient en moins de deux secondes et ne demande aucune dependance : le
# site n en a aucune, ce workflow non plus.
# ---------------------------------------------------------------------------
name: Contrôles Clicked

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une poussee qui en suit une autre de pres annule la precedente : verifier un
# etat deja remplace ne sert a rien et occupe un runner.
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Une virgule oubliee dans search-data.js rend le fichier invalide : le
      # navigateur abandonne le script entier et la recherche disparait de
      # TOUTES les pages, sans que rien ne le signale.
      - name: Fichiers de données chargeables
        run: node scripts/valider-js.js

      # Les onze controles : simulateurs, parcours, anneau, recherche,
      # glossaire, chiffres annonces, dates, accessibilite, couleurs,
      # traductions, liens et ancres, parite FR/EN.
      - name: Cohérence d'ensemble
        run: node scripts/audit-coherence.mjs

      # podcasts.html et podcast.xml sont ecrits par un script, a partir des
      # fichiers de podcasts/. Une retouche faite a la main dans la page serait
      # perdue au passage suivant, sans que rien ne le dise — sauf ici.
      #
      # La GENERATION de la voix, elle, ne tourne pas en integration : elle
      # demande une carte graphique et la voix de reference, qui n a rien a
      # faire dans un depot public.
      - name: Pages de podcasts conformes à leur source
        run: node scripts/publier-podcasts.js --verifier

      # L accueil annonce les guides mis a jour et les derniers episodes. Ecrit
      # a la main, ce bloc deviendrait faux au premier guide modifie sans que
      # personne le voie : la page resterait plausible.
      - name: Accueil conforme aux guides et aux podcasts
        run: node scripts/publier-accueil.js --verifier

      # Une lecon repliee ne montre que son titre. L amorce et la duree sont ce
      # qui permet de decider d ouvrir — une page ecrite sans elles serait
      # muette, et du contenu invisible ne proteste jamais.
      - name: Amorces et durées des leçons à jour
        run: node scripts/amorcer-lecons.js --verifier

      # Le bloc qui applique le theme et le confort de lecture avant le premier
      # affichage est duplique dans les 133 pages — il doit l'etre, sans quoi la
      # page sauterait au chargement. Une page restee a l'ancienne version ne
      # provoque aucune erreur : elle s'affiche simplement dans le mauvais
      # interlignage, ce que personne ne remarque en relisant du HTML.
      - name: Bloc de préférences d'affichage identique partout
        run: node scripts/amorcer-preferences.js --verifier

      # Le sélecteur de niveau est dupliqué sur les 112 pages de guide, et
      # chacune doit marquer SON niveau comme courant. Une page qui en
      # marquerait un autre resterait parfaitement lisible : le défaut ne se
      # voit qu'en comparant, ce que personne ne fait à la main.
      - name: Sélecteur de niveau à jour sur les guides
        run: node scripts/poser-selecteur-niveau.js --verifier

      # Les durées et le nombre de sections annoncés sur les sommaires étaient
      # saisis à la main, et avaient dérivé : le niveau avancé de Finance
      # annonçait 11 minutes pour 7,9 de texte. Un chiffre faux mais plausible
      # ne se voit jamais — sauf en le recalculant.
      - name: Chiffres des parcours conformes au texte
        run: node scripts/chiffrer-parcours.js --verifier

      # Le site tutoie son lecteur. Quelques passages gardent le vouvoiement —
      # avertissements legaux, blocs de non-conseil, paroles rapportees — et ils
      # sont recenses. Sans ce controle, le prochain guide serait ecrit dans le
      # registre de son auteur du jour, et le site redeviendrait ce qu il etait :
      # moitie tutoye, moitie vouvoye, sans que personne ne s en apercoive avant
      # d avoir tout relu.
      - name: Registre d'adresse au lecteur
        run: node scripts/verifier-registre.mjs

      # Les textes des simulateurs, sujet par sujet. Separe de l audit parce
      # qu il EXECUTE les 169 simulateurs pour voir ce qui s affichera.
      - name: Traduction des simulateurs
        run: |
          echec=0
          for sujet in apprendre cybersecurite data design dev-web droit ecologie \
                       entrepreneuriat finance ia marketing negociation productivite sante; do
            if ! node scripts/verifier-traduction.mjs "$sujet" en; then echec=1; fi
          done
          exit $echec

      # Les deux jeux de tests du depot. Ils existaient, mais rien ne les
      # lancait : celui des actualites est reste casse une journee entiere
      # apres une modification du script qu il couvre, sans que personne le
      # sache — il etait pourtant le seul a pouvoir le dire.
      - name: Tests de la publication d'actualités
        run: node scripts/test-actualites.mjs

      - name: Tests de la recherche
        run: node scripts/test-recherche.mjs

      # L echeancier de revision est le seul dispositif du site dont la panne
      # est SILENCIEUSE : une clef mal formee ou une echeance mal calculee ne
      # produit aucune erreur, juste un rappel qui n arrive jamais. Le test
      # fait defiler le temps a la main pour le dire tout de suite.
      - name: Tests des rappels de révision
        run: node scripts/test-revisions.mjs

      # Le seul controle qui MESURE des pages affichees : une largeur, un
      # nombre de colonnes, un debordement ne se deduisent pas du CSS. Il
      # tournait donc uniquement a la main.
      #
      # Chrome est preinstalle sur les runners ubuntu ; « --virtual-time-budget »
      # suffit a executer la page jusqu au bout, sans Playwright ni npm.
      - name: Géométrie des pages
        run: node scripts/lancer-audit-geometrie.mjs
