name: Publication des actualités Clicked

# Publie sur le site les articles COCHES dans les rapports de veille.
#
# Depuis le 21 aout 2026, la veille coche les cases d office : publier ne
# demande donc plus aucun geste.
#
# POURQUOI « workflow_run » ET NON « issues: opened »
#
# Le declencheur evident etait « issues: opened » : la veille cree l Issue, la
# publication suit. Il a ete essaye, et il ne se declenche JAMAIS. La
# documentation GitHub l explique : « events triggered by the GITHUB_TOKEN will
# not create a new workflow run », un garde-fou contre les boucles infinies.
# L Issue etant creee par Actions avec ce jeton, l evenement n existe pas.
#
# L ancien fonctionnement marchait justement parce qu il dependait d un HUMAIN :
# c est Ludo qui cochait, depuis le navigateur, avec son propre compte.
#
# « workflow_run » chaine les deux workflows sans jeton personnel : il se
# declenche a la fin de la veille, quel qu ait ete son propre declencheur.
on:
  workflow_run:
    workflows: ["Veille quotidienne Clicked"]
    types: [completed]
  # Le veto : decocher une case modifie le corps de l Issue. Cet evenement-la
  # vient d une personne, il se declenche donc bien.
  issues:
    types: [edited]
  workflow_dispatch:
  schedule:
    # Filet quotidien, au cas ou un evenement se serait perdu. Minute decalee :
    # GitHub retarde, voire abandonne, les taches planifiees a la minute 0.
    - cron: "41 5 * * *"

# Le travail consiste a ecrire dans le depot : sans « contents: write », le
# commit final echoue avec une erreur d authentification peu parlante.
permissions:
  contents: write
  issues: read

# Cocher trois cases d affilee declenche trois executions. Sans ce garde-fou,
# elles se marchent dessus sur le meme fichier et l une des trois echoue au
# moment de pousser.
concurrency:
  group: actualites
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest

    # Les Issues de rapport d usage declenchent le meme evenement : inutile de
    # demarrer une machine pour elles.
    if: >-
      github.event_name != 'issues' ||
      contains(join(github.event.issue.labels.*.name, ','), 'veille')

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # SYNCHRONISER, PUIS CONSTRUIRE, PUIS POUSSER — DANS CET ORDRE.
      #
      # Deux pannes en une soiree ont impose cette forme.
      #
      # La premiere : le workflow poussait sans jamais recuperer. Une poussee
      # faite a la main s est glissee entre son checkout et son push, et la
      # publication a echoue — l article qu on venait de retirer est reste en
      # ligne. Le garde-fou « concurrency » ne protege que contre deux
      # executions de CE workflow ; il ne sait rien d un humain qui pousse.
      #
      # La seconde, causee par le remede : recuperer APRES avoir construit.
      # Le commit portait des fichiers generes sur une base perimee, et le
      # rebase entrait en conflit avec ceux de l execution precedente.
      #
      # Un fichier ENTIEREMENT GENERE ne se fusionne pas : il se regenere.
      # D ou l ordre — on se remet a jour sur origin, on construit sur cette
      # base, on pousse. Si quelqu un a pousse entre-temps, on recommence :
      # reconstruire coute quelques secondes, et le resultat est le meme.
      - name: Construire et publier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for essai in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            node scripts/publier-actualites.js

            if [ -z "$(git status --porcelain)" ]; then
              echo "Rien à publier."
              exit 0
            fi

            # « git add -u » plutôt qu'une liste de fichiers : le script écrit
            # les quatre pages porteuses des marqueurs, françaises et anglaises.
            # La liste en dur n'en citait que deux ; les pages anglaises étaient
            # modifiées puis perdues au checkout suivant, sans que rien ne le
            # signale. Le contrôle ci-dessous rend l'oubli impossible.
            git add -u
            git commit --quiet -m "Publie les actualites retenues"

            if git push --quiet; then
              echo "Publié (essai $essai)."
              exit 0
            fi
            echo "Poussée refusée — quelqu'un a poussé entre-temps. On recommence."
          done

          echo "::error::Trois tentatives refusées. Le dépôt bouge plus vite que ce workflow."
          exit 1

      # Le script est la seule source de ces pages : si l'une d'elles n'a pas
      # ete versionnee, la liste anglaise se figerait en silence. On le
      # constate ici plutot que de le decouvrir des semaines plus tard.
      - name: Vérifier qu'il ne reste rien de modifié
        run: |
          reste="$(git status --porcelain)"
          if [ -n "$reste" ]; then
            echo "Des fichiers modifiés n'ont pas été publiés :"
            echo "$reste"
            exit 1
          fi
          echo "Rien ne reste de côté."
