name: Veille quotidienne DocMaster

on:
  schedule:
    # Les minutes ne sont pas choisies au hasard. GitHub previent que
    # l evenement schedule est retarde en periode de forte charge, et que
    # "high load times include the start of every hour" : a la minute 0, les
    # executions sont retardees, voire abandonnees. D ou ces minutes decalees.
    - cron: "23 7 * * *"    # 07h23 UTC
    - cron: "23 17 * * *"   # 17h23 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Exécuter le script de veille
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/veille.js
