    <script>
        /* Applique le theme AVANT le premier affichage.
           Le mode sombre etant le theme par defaut, sans ce script la page
           apparaitrait en clair une fraction de seconde avant de basculer.
           Doit rester inline : un fichier externe imposerait un aller-retour
           reseau, pendant lequel le fond clair serait deja peint. */
        (function () {
            try {
                // Mode sombre par defaut : le theme clair ne s'applique que si
                // le visiteur l'a explicitement demande via le bouton.
                if (localStorage.getItem('theme') !== 'light') {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) {
                // Stockage refuse : on applique quand meme le theme par defaut.
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
