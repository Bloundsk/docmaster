    <script>
        /* Applique le theme AVANT le premier affichage, sans quoi la page
           apparaitrait dans le mauvais theme une fraction de seconde avant de
           basculer. Doit rester inline : un fichier externe imposerait un
           aller-retour reseau, pendant lequel la page serait deja peinte.

           Regle : le choix explicite du visiteur, fait via le bouton, prime
           sur tout. En son absence, on suit le reglage de son systeme. */
        (function () {
            var choix = null;
            try { choix = localStorage.getItem('theme'); } catch (e) {}

            var sombre = choix
                ? choix === 'dark'
                : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

            if (sombre) document.documentElement.classList.add('dark-mode');
        })();
    </script>

</head>
<body>
    <script>
        window.DOCMASTER_BASE = "";
        // Cette page traduit son propre texte, plus bas : le bandeau « page non
        // traduite » n'a donc rien à annoncer ici.
        window.DOCMASTER_PAGE_AUTOTRADUITE = true;
    </script>
    <script src="assets/js/identite.js"></script>
    <script src="assets/js/langues.js"></script>
    <script src="assets/js/layout.js"></script>

    <header>
        <h1>😕 404</h1>
        <p id="e404-titre">Cette page n'existe pas ou a été déplacée.</p>
    </header>

    <main id="main-content" style="text-align:center;">
        <section>
            <p id="e404-texte" style="margin-bottom:20px;">Pas de panique — retourne à l'accueil pour retrouver tous les guides.</p>
            <a id="e404-lien" href="index.html" style="display:inline-block;background:var(--primary);color:white;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;">← Retour à l'accueil</a>
        </section>
    </main>

    <script>
        /* Cette page est servie par GitHub Pages pour TOUTE adresse inconnue,
           « /en/... » comprise : elle ne peut donc pas exister en plusieurs
           exemplaires, comme les autres pages du site. Elle traduit son propre
           texte, et le lien de retour mène à l'accueil de la bonne langue.

           Le français est écrit dans le HTML plutôt que posé ici : sans
           JavaScript, la page reste lisible dans la langue du site. */
        (function () {
            var L = window.DOCMASTER_LANGUES;
            if (!L) return;
            var langue = L.langueChoisie();
            if (langue === "fr") return;

            document.getElementById("e404-titre").textContent = L.t("introuvableTitre");
            document.getElementById("e404-texte").textContent = L.t("introuvableTexte");
            var lien = document.getElementById("e404-lien");
            lien.textContent = L.t("retourAccueil");
            if ((L.PAGES_TRADUITES[langue] || []).indexOf("index.html") !== -1) {
                lien.setAttribute("href", langue + "/index.html");
            }
            document.documentElement.setAttribute("lang", langue);
        })();
    </script>

    <div id="footer-placeholder"></div>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/enhance.js"></script>
    <script src="assets/js/mascotte.js"></script>
</body>
